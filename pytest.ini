; Test configuration for invocations that span more than one Python package.
;
; `foci/` is the Rust aggregate and is not itself a Python project, so this is a
; pytest.ini rather than a pyproject.toml: it carries test configuration only and
; implies no packaging.
;
; Each host package sets `pythonpath = ["."]` in its own pyproject.toml, resolved
; against rootdir. That works per package but cannot apply to two packages at
; once, so a spanning invocation found no config, put neither package on the path,
; and failed collection with ModuleNotFoundError. Per-package invocations still
; resolve to their own pyproject.toml and are unaffected by this file.
;
; importlib mode is required, not stylistic: klipper-foci and foci-trace both
; contain test_acceptance_matrix.py, test_protocol.py and test_velocity_integral.py,
; and the default prepend mode derives a top-level module name from the basename,
; so the second of each pair collides with the first in sys.modules.
[pytest]
pythonpath = host/klipper-foci/klipper_foci host/klipper-foci/klipper_foci_diagnostics host/foci-trace tools tools/ci
testpaths = host/klipper-foci/tests host/klipper-foci/klipper_foci/tests host/klipper-foci/klipper_foci_diagnostics/tests host/foci-trace/tests tools
addopts = --import-mode=importlib
