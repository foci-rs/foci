name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.board }} (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - board: openffboard-fw
            target: thumbv7em-none-eabi
          - board: ouroboros-fw
            target: thumbv7em-none-eabihf
        flavor: [prod, trace]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CARGO_PRIVATE_DEPS_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Configure cargo for private foci-rs deps (fallback)
        run: |
          git config --global url."https://x-access-token:${{ secrets.CARGO_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.cargo
          printf '[net]\ngit-fetch-with-cli = true\n' >> ~/.cargo/config.toml
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked
      - name: Derive release version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build and extract (prod)
        if: matrix.flavor == 'prod'
        run: |
          set -euo pipefail
          cargo build -p ${{ matrix.board }} --release --target ${{ matrix.target }}
          out="${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}"
          cargo objcopy -p ${{ matrix.board }} --release --target ${{ matrix.target }} -- -O binary "${out}.bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.board }}" "${out}.elf"
      - name: Build and extract (trace)
        if: matrix.flavor == 'trace'
        run: |
          set -euo pipefail
          cargo build -p ${{ matrix.board }} --release --target ${{ matrix.target }} --features trace
          out="${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}"
          cargo objcopy -p ${{ matrix.board }} --release --target ${{ matrix.target }} --features trace -- -O binary "${out}.bin"
          cp "target/${{ matrix.target }}/release/${{ matrix.board }}" "${out}.elf"
      - name: Verify artifacts are non-empty
        run: |
          set -euo pipefail
          out="${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}"
          test -s "${out}.bin"
          test -s "${out}.elf"
      - name: Checksum artifacts
        run: |
          set -euo pipefail
          out="${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}"
          sha256sum "${out}.bin" > "${out}.bin.sha256"
          sha256sum "${out}.elf" > "${out}.elf.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-${{ matrix.flavor }}
          path: |
            ${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}.bin
            ${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}.elf
            ${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}.bin.sha256
            ${{ matrix.board }}-v${{ steps.version.outputs.version }}-${{ matrix.flavor }}.elf.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the tagged commit is still reachable from main
        run: |
          set -euo pipefail
          git fetch origin main
          sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "FAIL: $sha (tag ${GITHUB_REF_NAME}) is not an ancestor of origin/main"
            exit 1
          fi
      - name: Verify the tagged commit's CI run on main passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "${GITHUB_REF_NAME}")"
          python tools/ci/release_ci_gate.py --repo "${{ github.repository }}" --sha "$sha"
      - name: Classify tag as release or prerelease
        id: classify
        run: |
          set -euo pipefail
          echo "kind=$(python tools/ci/release_version.py --tag "${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
      - name: Generate release notes
        run: git-cliff --config cliff.toml --tag "${GITHUB_REF_NAME}" --output release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Confirm trace and prod builds actually differ
        run: |
          set -euo pipefail
          for board in openffboard-fw ouroboros-fw; do
            prod_bin="artifacts/${board}-prod/${board}-${GITHUB_REF_NAME}-prod.bin"
            trace_bin="artifacts/${board}-trace/${board}-${GITHUB_REF_NAME}-trace.bin"
            if cmp -s "$prod_bin" "$trace_bin"; then
              echo "FAIL: $board prod and trace binaries are byte-identical (stale build?)"
              exit 1
            fi
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [ "${{ steps.classify.outputs.kind }}" = "prerelease" ]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --notes-file release-notes.md \
            $prerelease_flag \
            artifacts/*/*
