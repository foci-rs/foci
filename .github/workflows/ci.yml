name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CARGO_PRIVATE_DEPS_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi, thumbv7em-none-eabihf
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      # Patch overrides resolve git deps to local submodule paths; no
      # cargo network fetch should happen, but configure cli fetch as a
      # safety net for any unpatched dep.
      - name: Configure cargo for private foci-rs deps (fallback)
        run: |
          git config --global url."https://x-access-token:${{ secrets.CARGO_PRIVATE_DEPS_TOKEN }}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.cargo
          printf '[net]\ngit-fetch-with-cli = true\n' >> ~/.cargo/config.toml
      - name: cargo fmt (workspace)
        run: cargo fmt --all --check
      - name: cargo fmt (ankyra workspace)
        run: cargo fmt --manifest-path ankyra/Cargo.toml --all --check
      - name: cargo clippy (host members)
        run: cargo clippy -- -D warnings
      - name: cargo clippy (openffboard board)
        run: cargo clippy -p openffboard-fw --target thumbv7em-none-eabi -- -D warnings
      - name: cargo clippy (ouroboros board)
        run: cargo clippy -p ouroboros-fw --target thumbv7em-none-eabihf -- -D warnings
      - name: cargo clippy (ankyra workspace)
        run: cargo clippy --manifest-path ankyra/Cargo.toml --workspace --all-targets -- -D warnings
      - name: cargo test (host members)
        run: cargo test
      - name: cargo test (ankyra workspace)
        run: cargo test --manifest-path ankyra/Cargo.toml --workspace
      - name: cargo build (host, release)
        run: cargo build --release
      - name: cargo build (openffboard board, release)
        run: cargo build -p openffboard-fw --target thumbv7em-none-eabi --release
      - name: cargo build (ouroboros board, release)
        run: cargo build -p ouroboros-fw --target thumbv7em-none-eabihf --release
      - name: Set up Python for board parity gate
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install board parity gate deps
        run: pip install -r tools/requirements.txt
      - name: Board command/reply parity gate
        run: python tools/ci/board_parity.py
      - name: Vocabulary codegen drift gate
        run: |
          # Each generated target must be tracked (a deleted file regenerates as
          # untracked, which `git diff` would not catch).
          git -C shared/foci-firmware ls-files --error-unmatch src/commissioning/vocabulary_generated.rs
          git -C host/klipper-foci ls-files --error-unmatch klipper_foci/klipper_foci/_vocabulary_generated.py
          git -C host/foci-trace ls-files --error-unmatch foci_trace/_vocabulary_generated.py
          python tools/gen_commissioning_vocabulary.py
          git -C shared/foci-firmware diff --exit-code -- src/commissioning/vocabulary_generated.rs
          git -C host/klipper-foci diff --exit-code -- klipper_foci/klipper_foci/_vocabulary_generated.py
          git -C host/foci-trace diff --exit-code -- foci_trace/_vocabulary_generated.py
      - name: cargo build (openffboard trace diagnostic, release)
        run: cargo build -p openffboard-fw --target thumbv7em-none-eabi --release --features trace
      - name: OpenFFBoard commissioning stack-frame gate
        run: python tools/ci/stack_frame_gate.py
      - name: STATUS_FLAGS clear-site gate
        run: python tools/ci/status_flags_clear_gate.py
      - name: mkdir rtic-future-gate artifact dir
        run: mkdir -p target/rtic-future-gate
      - name: Save openffboard-fw trace ELF for the RTIC future gate
        run: cp target/thumbv7em-none-eabi/release/openffboard-fw target/rtic-future-gate/openffboard-fw-trace
      - name: cargo build (openffboard board, release, re-build without trace)
        run: cargo build -p openffboard-fw --target thumbv7em-none-eabi --release
      - name: Save openffboard-fw release ELF for the RTIC future gate
        run: cp target/thumbv7em-none-eabi/release/openffboard-fw target/rtic-future-gate/openffboard-fw
      - name: cargo build (ouroboros trace diagnostic, release)
        run: cargo build -p ouroboros-fw --target thumbv7em-none-eabihf --release --features trace
      - name: Save ouroboros-fw trace ELF for the RTIC future gate
        run: cp target/thumbv7em-none-eabihf/release/ouroboros-fw target/rtic-future-gate/ouroboros-fw-trace
      - name: cargo build (ouroboros board, release, re-build without trace)
        run: cargo build -p ouroboros-fw --target thumbv7em-none-eabihf --release
      - name: Save ouroboros-fw release ELF for the RTIC future gate
        run: cp target/thumbv7em-none-eabihf/release/ouroboros-fw target/rtic-future-gate/ouroboros-fw
      - name: Install nightly Rust toolchain (RTIC future-size probe)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv7em-none-eabi, thumbv7em-none-eabihf
      - name: Capture openffboard-fw type sizes (release)
        run: |
          RUSTFLAGS="-Zprint-type-sizes" cargo +nightly build -p openffboard-fw \
            --target thumbv7em-none-eabi --release \
            > openffboard-fw-type-sizes.txt 2>&1
      - name: Capture openffboard-fw type sizes (trace)
        run: |
          RUSTFLAGS="-Zprint-type-sizes" cargo +nightly build -p openffboard-fw \
            --target thumbv7em-none-eabi --release --features trace \
            > openffboard-fw-trace-type-sizes.txt 2>&1
      - name: Capture ouroboros-fw type sizes (release)
        run: |
          RUSTFLAGS="-Zprint-type-sizes" cargo +nightly build -p ouroboros-fw \
            --target thumbv7em-none-eabihf --release \
            > ouroboros-fw-type-sizes.txt 2>&1
      - name: Capture ouroboros-fw type sizes (trace)
        run: |
          RUSTFLAGS="-Zprint-type-sizes" cargo +nightly build -p ouroboros-fw \
            --target thumbv7em-none-eabihf --release --features trace \
            > ouroboros-fw-trace-type-sizes.txt 2>&1
      - name: RTIC tmc_control future-size and free-SRAM gate
        run: python tools/ci/rtic_future_gate.py
